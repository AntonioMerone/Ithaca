<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#12343b">
    <meta name="description" content="Ithaca, il dossier digitale del tuo viaggio.">
    <title>Ithaca</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/icons/favicon-32x32.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <a class="app-brand" href="#/home" aria-label="Vai alla home">
          <span class="app-brand__mark" aria-hidden="true">I</span>
          <span>
            <span class="app-brand__name">Ithaca</span>
            <span class="app-brand__tagline">Il dossier digitale</span>
          </span>
        </a>
        <div class="app-header__status" id="route-status" aria-live="polite">Home</div>
      </header>

      <main class="app-main" id="app" tabindex="-1"></main>
    </div>

    <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>
    <div id="modal-root"></div>

    <noscript>
      <p class="noscript-message">Ithaca richiede JavaScript per funzionare.</p>
    </noscript>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
